<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/></marker></defs><line x1="450" y1="310" x2="450" y2="78" stroke="#d9cdb8" stroke-width="2"/><line x1="450" y1="310" x2="755" y2="200" stroke="#d9cdb8" stroke-width="2"/><line x1="450" y1="310" x2="755" y2="420" stroke="#d9cdb8" stroke-width="2"/><line x1="450" y1="310" x2="450" y2="542" stroke="#d9cdb8" stroke-width="2"/><line x1="450" y1="310" x2="145" y2="420" stroke="#d9cdb8" stroke-width="2"/><line x1="450" y1="310" x2="145" y2="200" stroke="#d9cdb8" stroke-width="2"/><circle cx="450" cy="310" r="78" fill="#ffffff" stroke="#1c1b18" stroke-width="3"/><text x="450" y="304" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="middle"><tspan x="450" dy="0.0">What they</tspan><tspan x="450" dy="27.6">press on</tspan></text><rect x="314.0" y="24.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="450" y="60" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="450" dy="0.0">Guilt</tspan></text><text x="450" y="90" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="450" dy="0.0">&quot;After all I&#x27;ve done</tspan><tspan x="450" dy="24.0">for you...&quot;</tspan></text><rect x="619.0" y="146.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="755" y="182" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="755" dy="0.0">Need for approval</tspan></text><text x="755" y="212" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="755" dy="0.0">Praise right before</tspan><tspan x="755" dy="24.0">a request</tspan></text><rect x="619.0" y="366.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="755" y="402" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="755" dy="0.0">Fear of conflict</tspan></text><text x="755" y="432" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="755" dy="0.0">A raised voice,</tspan><tspan x="755" dy="24.0">a cold silence</tspan></text><rect x="314.0" y="488.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="450" y="524" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="450" dy="0.0">Urgency</tspan></text><text x="450" y="554" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="450" dy="0.0">&quot;I need an answer</tspan><tspan x="450" dy="24.0">right now.&quot;</tspan></text><rect x="9.0" y="366.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="145" y="402" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="145" dy="0.0">Fear of loss</tspan></text><text x="145" y="432" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="145" dy="0.0">Threats to pull away</tspan><tspan x="145" dy="24.0">or leave</tspan></text><rect x="9.0" y="146.0" width="272" height="108" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="145" y="182" font-family="'EB Garamond', Georgia, serif" font-size="25" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="145" dy="0.0">Need to be seen as good</tspan></text><text x="145" y="212" font-family="'EB Garamond', Georgia, serif" font-size="20" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="145" dy="0.0">&quot;I thought I could</tspan><tspan x="145" dy="24.0">count on you.&quot;</tspan></text></svg>