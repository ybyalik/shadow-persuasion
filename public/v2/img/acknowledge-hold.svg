<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/></marker></defs><rect x="120" y="20" width="560" height="104" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="400.0" y="60" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="400.0" dy="0.0">THEY PRESS</tspan></text><text x="400.0" y="96" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#1c1b18" text-anchor="middle"><tspan x="400.0" dy="0.0">&quot;After everything I&#x27;ve done for you...&quot;</tspan></text><rect x="120" y="174" width="560" height="104" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="400.0" y="214" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="400.0" dy="0.0">1. ACKNOWLEDGE THE FEELING, ONCE</tspan></text><text x="400.0" y="250" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#1c1b18" text-anchor="middle"><tspan x="400.0" dy="0.0">&quot;You&#x27;ve done a lot for me, and I&#x27;m grateful.&quot;</tspan></text><rect x="120" y="328" width="560" height="104" rx="10" fill="#ffffff" stroke="#1c1b18" stroke-width="3"/><text x="400.0" y="368" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="400.0" dy="0.0">2. HOLD THE DECISION</tspan></text><text x="400.0" y="404" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#1c1b18" text-anchor="middle"><tspan x="400.0" dy="0.0">&quot;I&#x27;m still not able to do this.&quot;</tspan></text><rect x="120" y="482" width="560" height="104" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><text x="400.0" y="522" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" font-style="normal" fill="#8a5a2b" text-anchor="middle"><tspan x="400.0" dy="0.0">3. STOP. LET IT SIT.</tspan></text><text x="400.0" y="558" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#1c1b18" text-anchor="middle"><tspan x="400.0" dy="0.0">No reasons, no apology, no &quot;maybe next time.&quot;</tspan></text><line x1="400.0" y1="128" x2="400.0" y2="168" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr)"/><line x1="400.0" y1="282" x2="400.0" y2="322" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr)"/><line x1="400.0" y1="436" x2="400.0" y2="476" stroke="#8a5a2b" stroke-width="3" marker-end="url(#arr)"/><path d="M 680 534.0 H 750 V 380.0 H 688" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="758" y="443.0" font-family="'EB Garamond', Georgia, serif" font-size="19" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="start"><tspan x="758" dy="0.0">If they push:</tspan><tspan x="758" dy="22.8">repeat the</tspan><tspan x="758" dy="22.8">same sentence</tspan></text></svg>