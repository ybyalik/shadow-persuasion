<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/></marker></defs><rect x="10" y="10" width="430" height="178" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><circle cx="56" cy="56" r="22" fill="#8a5a2b"/><text x="56" y="64" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle"><tspan x="56" dy="0.0">1</tspan></text><text x="94" y="64" font-family="'EB Garamond', Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="start"><tspan x="94" dy="0.0">The disclosure test</tspan></text><text x="44" y="118" font-family="'EB Garamond', Georgia, serif" font-size="23" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="start"><tspan x="44" dy="0.0">Would I be comfortable if they</tspan><tspan x="44" dy="28.8">knew exactly what I was doing?</tspan></text><rect x="460" y="10" width="430" height="178" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><circle cx="506" cy="56" r="22" fill="#8a5a2b"/><text x="506" y="64" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle"><tspan x="506" dy="0.0">2</tspan></text><text x="544" y="64" font-family="'EB Garamond', Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="start"><tspan x="544" dy="0.0">The reversal test</tspan></text><text x="494" y="118" font-family="'EB Garamond', Georgia, serif" font-size="23" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="start"><tspan x="494" dy="0.0">Would I think it was fair if</tspan><tspan x="494" dy="28.8">someone did this to me?</tspan></text><rect x="10" y="208" width="430" height="178" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><circle cx="56" cy="254" r="22" fill="#8a5a2b"/><text x="56" y="262" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle"><tspan x="56" dy="0.0">3</tspan></text><text x="94" y="262" font-family="'EB Garamond', Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="start"><tspan x="94" dy="0.0">The free-choice test</tspan></text><text x="44" y="316" font-family="'EB Garamond', Georgia, serif" font-size="23" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="start"><tspan x="44" dy="0.0">Can they say no without</tspan><tspan x="44" dy="28.8">being punished?</tspan></text><rect x="460" y="208" width="430" height="178" rx="10" fill="#f4efe6" stroke="#d9cdb8" stroke-width="1.5"/><circle cx="506" cy="254" r="22" fill="#8a5a2b"/><text x="506" y="262" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle"><tspan x="506" dy="0.0">4</tspan></text><text x="544" y="262" font-family="'EB Garamond', Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="start"><tspan x="544" dy="0.0">The outcome test</tspan></text><text x="494" y="316" font-family="'EB Garamond', Georgia, serif" font-size="23" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="start"><tspan x="494" dy="0.0">Is the result fair</tspan><tspan x="494" dy="28.8">to both of us?</tspan></text><rect x="10" y="418" width="880" height="128" rx="10" fill="#ffffff" stroke="#1c1b18" stroke-width="3"/><text x="450" y="468" font-family="'EB Garamond', Georgia, serif" font-size="28" font-weight="600" font-style="normal" fill="#1c1b18" text-anchor="middle"><tspan x="450" dy="0.0">Yes to all four: that&#x27;s influence.</tspan></text><text x="450" y="510" font-family="'EB Garamond', Georgia, serif" font-size="24" font-weight="400" font-style="italic" fill="#6b6458" text-anchor="middle"><tspan x="450" dy="0.0">No to any one: rethink it before you say it.</tspan></text></svg>